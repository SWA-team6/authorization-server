
name: Development Task
description: Track an implementation or maintenance task
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be accomplished?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the work to be performed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List the conditions for completion.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, documents, or PRs.

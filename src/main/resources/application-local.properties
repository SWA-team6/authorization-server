server.address=127.0.0.1
server.port=9000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
cils.local.username=${CILS_LOCAL_USERNAME:demo}
cils.local.password=${CILS_LOCAL_PASSWORD}
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000
spring.security.oauth2.authorizationserver.client.local.registration.client-id=local-client
spring.security.oauth2.authorizationserver.client.local.registration.client-secret=${CILS_LOCAL_CLIENT_SECRET_HASH}
spring.security.oauth2.authorizationserver.client.local.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.local.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.local.registration.redirect-uris=http://127.0.0.1:8080/login/oauth2/code/cils
spring.security.oauth2.authorizationserver.client.local.registration.scopes=openid,profile
spring.security.oauth2.authorizationserver.client.local.require-proof-key=true
spring.security.oauth2.authorizationserver.client.local.require-authorization-consent=true
spring.security.oauth2.authorizationserver.client.local.token.access-token-time-to-live=5m
spring.security.oauth2.authorizationserver.client.local.token.refresh-token-time-to-live=1h
spring.security.oauth2.authorizationserver.client.local.token.reuse-refresh-tokens=false

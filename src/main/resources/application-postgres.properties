# PostgreSQL accounts/grants and Redis HTTP sessions. Coordinated logout remains deferred.
server.address=127.0.0.1
server.port=9000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${CILS_DB_URL:jdbc:postgresql://localhost:5432/authorization?currentSchema=cils}
spring.datasource.username=${CILS_DB_USERNAME:auth_user}
spring.datasource.password=${CILS_DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.security.oauth2.authorizationserver.issuer=${CILS_ISSUER:http://localhost:9000}
cils.signing.jwk-file=${CILS_SIGNING_JWK_FILE}
spring.flyway.default-schema=cils

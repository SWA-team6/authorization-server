spring.application.name=cils
# Select postgres for persistent accounts/grants, or local for synthetic in-memory accounts.
spring.profiles.default=unconfigured

spring.data.redis.host=${CILS_REDIS_HOST:localhost}
spring.data.redis.port=${CILS_REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.session.timeout=${CILS_SESSION_TIMEOUT:30m}
spring.session.redis.namespace=${CILS_SESSION_NAMESPACE:authorization:session}
spring.session.redis.repository-type=default
